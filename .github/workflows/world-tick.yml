# The pre-pre-alpha "server": once a day, roll the shared Corp Bulletin
# (event modifier + featured lot), commit it, then redeploy the static site.
name: World tick

on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tick.mjs
      - id: commit
        run: |
          if git diff --quiet -- data/bulletin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "world-tick[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bulletin.json
          git commit -m "world tick: bulletin $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: tick
    if: needs.tick.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
