# Deploys the static site to Hostinger over FTP.
# Set these in Settings → Secrets and variables → Actions:
#   secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variable (optional): FTP_SERVER_DIR  (default: public_html/)
# Until the secrets exist, this workflow runs its checks and skips the upload.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pick up the commit a world tick just pushed

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanity checks
        run: |
          for f in js/*.js scripts/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('data/world.json'))"
          node -e "JSON.parse(require('fs').readFileSync('data/bulletin.json'))"

      - name: Check FTP secrets
        id: cfg
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FTP secrets not set; skipping upload."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Hostinger
        if: steps.cfg.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            scripts/**
            package.json
            README.md
            **/node_modules/**
