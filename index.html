<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLAIM // SPACE — pre-pre-alpha sandbox</title>
  <meta name="description" content="Clone 1 of the Claim Avenue concept: a top-down dystopian space sandbox. Pre-pre-alpha, simulated money only." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23060708'/%3E%3Cpath d='M8 2 L13 13 L8 10 L3 13 Z' fill='%23e8c547'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="banner">PRE-PRE-ALPHA · SIMULATED MONEY · NOTHING HERE IS REAL (YET)</div>

  <div id="hud">
    <div class="row"><span class="k">CASH</span><span id="h-cash" class="v">$0</span><span class="tag">test $</span></div>
    <div class="row"><span class="k">CREDITS</span><span id="h-credits" class="v">0</span><span class="tag">no cash value</span></div>
    <div class="row"><span class="k">SCRAP</span><span id="h-scrap" class="v">0</span><span class="tag">game only</span></div>
    <div class="row"><span class="k">LEVEL</span><span id="h-level" class="v">1</span><span class="tag" id="h-sight"></span></div>
    <div class="xp"><div id="h-xp"></div></div>
    <div class="row small"><span id="h-mode"></span> · <span id="h-sector"></span> · <span id="h-speed"></span></div>
  </div>

  <div id="bulletin"></div>
  <div id="log"></div>
  <div id="prompt"></div>
  <canvas id="minimap" width="200" height="150"></canvas>
  <div id="hint">H · controls &nbsp; TAB · ledger</div>

  <div id="modal" hidden>
    <div id="panel" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
